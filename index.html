<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Homes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">Premium Homes</div>

    <nav>
        <a href="#home">Home</a>
        <a href="#gallery">Gallery</a>
        <a href="#contact">Contact</a>
    </nav>
</header>


<section class="hero" id="home">

    <div class="hero-content">

        <h1>Beautiful Modern Homes</h1>

        <p>
            Clean designs, premium finishes, and elegant wood flooring.
        </p>

        <button>
            View Homes
        </button>

    </div>

</section>



<section id="gallery">

    <h2>Featured Home</h2>

    <div class="image-grid">

        <img src="images/hero-home.jpg" alt="Modern home">

        <img src="images/hero-home.jpg" alt="Modern home">

        <img src="images/hero-home.jpg" alt="Modern home">

    </div>

</section>



<section id="contact">

    <h2>Contact Us</h2>

    <form>

        <input type="text" placeholder="Name">

        <input type="email" placeholder="Email">

        <textarea placeholder="Message"></textarea>

        <button>
            Send
        </button>

    </form>

</section>



<footer>

    <p>
        © 2026 Premium Homes
    </p>

</footer>


</body>
</html>
